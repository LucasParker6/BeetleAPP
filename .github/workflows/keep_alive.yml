name: Keep Streamlit App Alive

on:
  schedule:
    # 每 6 小時執行一次（格林威治時間 0, 6, 12, 18 點）
    - cron: '0 */6 * * *'
  # 允許手動點擊測試
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          curl -sL https://beetleapp-6jcvuxa8q7gjmwtv4zi9ni.streamlit.app/ > /dev/null
          echo "Pinged Streamlit app successfully!"
